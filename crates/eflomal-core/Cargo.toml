[package]
name = "eflomal-core"
description = "Core of eflomal revisited: a fast, low-memory Bayesian word aligner (collapsed Gibbs sampling)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
memchr = "2.8.3"
memmap2 = "0.9.12"
rayon = "1.12.0"
rustc-hash = "2.1.3"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "eflomalr"
path = "src/bin/eflomalr.rs"
